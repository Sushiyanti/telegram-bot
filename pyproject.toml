[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "telegram-private-media-bot"
version = "0.1.0"
description = "Private Telegram media storage and access-control bot"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "aiosqlite==0.22.1",
    "python-telegram-bot==22.8",
]

[project.scripts]
telegram-storage-bot = "media_bot.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/media_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.uv]
package = true
